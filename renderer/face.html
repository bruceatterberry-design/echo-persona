<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Face Library</title>
<style>
  :root { --bg: #07090c; --panel: #0e1217; --line: #1c232c; --text: #d9e1e8; --dim: #7c8894;
          --accent: #7fb8d6; --good: #8fcfa8; --warn: #c9a86a; --err: #d97b7b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: .3em; font-size: 16px; }
  a { color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.on { background: var(--accent); color: #07131b; }
  button.me.on { background: var(--good); border-color: var(--good); }
  button.no.on { background: var(--err); border-color: var(--err); color: #fff; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; }
  .counts { color: var(--dim); font-size: 13px; }
  .counts b { color: var(--text); font-weight: 500; }
  .note { background: var(--panel); border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .group { margin: 26px 0 10px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card.owner { border-color: var(--good); }
  .card.not_owner, .card.excluded { opacity: .45; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; }
  .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .meta { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .issues { font-size: 11px; color: var(--warn); min-height: 1.2em; }
  .hint { font-size: 11px; color: var(--good); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .star { border: 0; font-size: 18px; padding: 0 4px; color: var(--dim); }
  .star.on { background: transparent; color: var(--warn); }
  .empty { color: var(--dim); padding: 30px 0; }
</style>
</head>
<body>
<header>
  <h1>FACE LIBRARY</h1>
  <div class="bar" style="margin:0"><button id="scan">Look for new photos</button><a href="/">← Back to Echo</a></div>
</header>
<main>
  <div id="msg"></div>
  <div class="bar">
    <span class="counts" id="counts"></span>
    <span style="flex:1"></span>
    <label class="counts">Show <select id="filter">
      <option value="pending">Needs review</option><option value="all">All faces</option>
      <option value="owner">Me</option><option value="not_owner">Not me / excluded</option></select></label>
  </div>
  <p class="counts" style="margin-top:0">For each face: <b>This is me</b> or <b>Not me</b>. ★ marks your favourite references. Use <b>Exclude</b> for photos of you that you don't want used (bad angle, blurry, sunglasses…).</p>
  <div id="lib"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let data = null;
async function api(path, opts) { const r = await fetch('/api/face/' + path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.detail); return j; }
function msg(text, warn = true) { $('msg').innerHTML = ''; if (!text) return; const d = document.createElement('div'); d.className = 'note'; d.textContent = text; if (!warn) d.style.borderColor = d.style.color = 'var(--good)'; $('msg').appendChild(d); }
async function load() { data = await api('library'); render(); }
function render() {
  const c = data.counts;
  $('counts').innerHTML = `<b>${c.photos}</b> photos · <b>${c.faces}</b> faces · <b>${c.pending}</b> to review · me: <b>${c.approved_current}</b> current, <b>${c.approved_younger}</b> younger · <b>${c.preferred}</b> ★`;
  if (data.links_waiting && !$('msg').textContent) msg(`${data.links_waiting} items in the drop folders are web links, not photos. Open each one, press Shift+D (or ⋮ → Download) in Google Photos, and drop the downloaded file in.`);
  const f = $('filter').value, L = $('lib'); L.innerHTML = '';
  for (const group of ['current', 'younger']) {
    const items = [];
    for (const p of data.photos.filter(p => p.group === group))
      p.faces.forEach((face, i) => { if (f === 'all' || face.status === f || (f === 'not_owner' && face.status === 'excluded')) items.push([p, face, i]); });
    const h = document.createElement('div'); h.className = 'group'; h.textContent = group === 'current' ? 'Current photos' : 'Younger photos'; L.appendChild(h);
    if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing here.'; L.appendChild(e); continue; }
    // most likely "me" first, so review goes quickly
    items.sort((a, b) => (b[1].hint ?? -9) - (a[1].hint ?? -9));
    const g = document.createElement('div'); g.className = 'grid'; L.appendChild(g);
    for (const [p, face, i] of items) g.appendChild(card(p, face, i));
  }
}
function card(p, face, i) {
  const d = document.createElement('div'); d.className = 'card ' + face.status;
  const img = document.createElement('img'); img.loading = 'lazy'; img.src = '/api/face/crop/' + face.crop; img.alt = 'Face from ' + p.name;
  const info = document.createElement('div'); info.className = 'info';
  const meta = document.createElement('div'); meta.className = 'meta'; meta.title = p.name;
  meta.textContent = `${p.name} · face ${face.face_px}px` + (p.faces.length > 1 ? ` · ${p.faces.length} people` : '');
  const iss = document.createElement('div'); iss.className = 'issues'; iss.textContent = face.issues.join(', ');
  info.append(meta, iss);
  if (face.status === 'pending' && face.hint !== null) {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = face.hint > 0.02 ? 'Looks like you (guess)' : face.hint < -0.02 ? 'Probably not you (guess)' : '';
    if (h.textContent) info.appendChild(h);
  }
  const row = document.createElement('div'); row.className = 'row';
  const b = (label, cls, status) => { const x = document.createElement('button'); x.textContent = label; x.className = cls + (face.status === status ? ' on' : '');
    x.onclick = () => set(p, i, { status: face.status === status ? 'pending' : status }); return x; };
  row.append(b('This is me', 'me', 'owner'), b('Not me', 'no', 'not_owner'), b('Exclude', '', 'excluded'));
  if (face.status === 'owner') {
    const s = document.createElement('button'); s.className = 'star' + (face.preferred ? ' on' : ''); s.textContent = '★'; s.title = 'Favourite reference';
    s.setAttribute('aria-label', 'Favourite'); s.onclick = () => set(p, i, { preferred: !face.preferred }); row.appendChild(s);
  }
  info.appendChild(row);
  if (p.group === 'younger' && face.status === 'owner') {
    const sel = document.createElement('select'); sel.setAttribute('aria-label', 'Age in this photo');
    for (const a of ['unknown', 'child', 'teens', '20s', '30s', '40s', '50s']) { const o = document.createElement('option'); o.value = a; o.textContent = 'Age: ' + a; sel.appendChild(o); }
    if (![...sel.options].some(o => o.value === p.age_label)) { const o = document.createElement('option'); o.value = p.age_label; o.textContent = 'Age: ' + p.age_label; sel.appendChild(o); }
    sel.value = p.age_label; sel.onchange = () => set(p, i, { age_label: sel.value }); info.appendChild(sel);
  }
  d.append(img, info); return d;
}
async function set(p, i, body) {
  try { await api(`${p.sha256}/${i}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); await load(); }
  catch (e) { msg('Couldn’t save that: ' + e.message); }
}
$('filter').onchange = render;
$('scan').onclick = async () => {
  $('scan').disabled = true; $('scan').textContent = 'Looking…';
  try {
    const r = await api('scan', { method: 'POST' });
    msg(`Found ${r.new_photos} new photo(s) with ${r.faces_found} face(s)` + (r.duplicates ? `, skipped ${r.duplicates} already added` : '') + (r.unzipped ? `, unpacked ${r.unzipped} from zip files` : '') + '.', false);
    await load();
  } catch (e) { msg(e.message); }
  $('scan').disabled = false; $('scan').textContent = 'Look for new photos';
};
load().catch(e => msg('Can’t reach Echo: ' + e.message));
</script>
</body>
</html>
