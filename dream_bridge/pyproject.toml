[project]
name = "echo-dream-bridge"
version = "0.1.0"
description = "Mac side of the Echo Dream Engine link (see ../docs/dream/BRIDGE_PROTOCOL.md)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "cryptography==44.0.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
