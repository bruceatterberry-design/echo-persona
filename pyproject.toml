[project]
name = "echo-persona"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pyyaml==6.0.2",
  "mlx-whisper==0.4.2",
  "pillow==11.1.0",
  "python-multipart==0.0.20",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
