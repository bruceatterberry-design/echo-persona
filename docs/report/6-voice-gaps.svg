<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-label="Silence inside Echo&#x27;s voice while the model is busy (seconds, 4 replies)"><rect width="760" height="238" fill="#fcfcfb" rx="8"/><text x="24" y="34" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600" fill="#0b0b0b">Silence inside Echo&#x27;s voice while the model is busy (seconds, 4 replies)</text><text x="24" y="56" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#52514e">Freeing memory stopped the swapping but not the gaps; the faster 8-bit voice reduced them (3 gaps → 2)</text><line x1="210.0" y1="90" x2="210.0" y2="204" stroke="#e4e3df" stroke-width="1"/><text x="210.0" y="222" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#8a8984">0 s</text><line x1="365.33333333333337" y1="90" x2="365.33333333333337" y2="204" stroke="#e4e3df" stroke-width="1"/><text x="365.33333333333337" y="222" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#8a8984">2 s</text><line x1="520.6666666666667" y1="90" x2="520.6666666666667" y2="204" stroke="#e4e3df" stroke-width="1"/><text x="520.6666666666667" y="222" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#8a8984">4 s</text><line x1="676.0" y1="90" x2="676.0" y2="204" stroke="#e4e3df" stroke-width="1"/><text x="676.0" y="222" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px" fill="#8a8984">6 s</text><text x="198" y="108.0" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#0b0b0b">Start of day (jitter buffer only)</text><path d="M210,96 H480.94 Q484.94,96 484.94,100 V108 Q484.94,112 480.94,112 H210 Z" fill="#2a78d6"/><text x="490.94" y="108" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px" fill="#52514e">3.5 s</text><text x="198" y="142.0" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#0b0b0b">After freeing memory</text><path d="M210,130 H585.79 Q589.79,130 589.79,134 V142 Q589.79,146 585.79,146 H210 Z" fill="#2a78d6"/><text x="595.79" y="142" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px" fill="#52514e">4.9 s</text><text x="198" y="176.0" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#0b0b0b">After 8-bit voice</text><path d="M210,164 H365.2166666666667 Q369.2166666666667,164 369.2166666666667,168 V176 Q369.2166666666667,180 365.2166666666667,180 H210 Z" fill="#2a78d6"/><text x="375.2166666666667" y="176" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px" fill="#52514e">2.0 s</text><line x1="210" y1="90" x2="210" y2="204" stroke="#8a8984" stroke-width="1"/></svg>