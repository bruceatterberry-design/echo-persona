<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Echo Persona 1.0.0-beta</title>
  <desc id="d">Release banner. First word after Echo has read the conversation: 2.5 seconds down to 0.25 seconds. After a 30-minute break, memory questions start in 3.2 to 3.8 seconds instead of 6 to 7. Replies ending in a question: 15 of 20 down to 6 of 20. Photo questions asked 6 of 6 with no invented details. 707 tests passing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a19"/>
      <stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3987e5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .kicker { fill: #c3c2b7; font-size: 15px; letter-spacing: 2.5px; font-weight: 600; }
    .title { fill: #f0efec; font-size: 40px; font-weight: 700; }
    .sub { fill: #c3c2b7; font-size: 17px; }
    .hero { fill: #f0efec; font-size: 84px; font-weight: 700; }
    .herolabel { fill: #c3c2b7; font-size: 16px; }
    .was { fill: #8f8e86; font-size: 16px; }
    .tv { fill: #f0efec; font-size: 26px; font-weight: 650; }
    .tl { fill: #c3c2b7; font-size: 14px; }
    .tile { fill: #222424; stroke: #33363a; stroke-width: 1; }
  </style>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>

  <!-- voice waveform (decorative): fades in, peaks at the hero, fades out -->
  <g opacity="0.55" fill="#3987e5">
    <rect x="40" y="214" width="4" height="12" rx="2"/><rect x="52" y="208" width="4" height="24" rx="2"/>
    <rect x="64" y="200" width="4" height="40" rx="2"/><rect x="76" y="210" width="4" height="20" rx="2"/>
    <rect x="88" y="192" width="4" height="56" rx="2"/><rect x="100" y="203" width="4" height="34" rx="2"/>
    <rect x="112" y="186" width="4" height="68" rx="2"/><rect x="124" y="198" width="4" height="44" rx="2"/>
    <rect x="136" y="208" width="4" height="24" rx="2"/>
  </g>
  <rect x="40" y="300" width="560" height="2" fill="url(#glow)"/>

  <!-- header -->
  <text class="kicker" x="40" y="62">ECHO PERSONA · RELEASE</text>
  <text class="title" x="40" y="110">1.0.0-beta: thinks before it speaks</text>
  <text class="sub" x="40" y="142">One transparent controller, honest answers, lessons that get checked, and your own names in settings.</text>

  <!-- hero figure: the one number this release leads with -->
  <text class="herolabel" x="160" y="196">First word after Echo has read the conversation</text>
  <text class="hero" x="160" y="276">0.25 s</text>
  <text class="was" x="420" y="276">was 2.5 s</text>
  <text class="herolabel" x="40" y="336">Measured on a Mac mini M4, 16 GB, with Echo's own local model.</text>

  <!-- stat tiles -->
  <g transform="translate(640,176)">
    <rect class="tile" width="250" height="104" rx="12"/>
    <text class="tl" x="20" y="32">After a 30-minute break</text>
    <text class="tv" x="20" y="68">3.2–3.8 s</text>
    <text class="tl" x="20" y="90">first word (was 6–7 s)</text>
  </g>
  <g transform="translate(910,176)">
    <rect class="tile" width="250" height="104" rx="12"/>
    <text class="tl" x="20" y="32">Replies ending in a question</text>
    <text class="tv" x="20" y="68">6 of 20</text>
    <text class="tl" x="20" y="90">was 15 of 20</text>
  </g>
  <g transform="translate(640,296)">
    <rect class="tile" width="250" height="104" rx="12"/>
    <text class="tl" x="20" y="32">Photo questions asked</text>
    <text class="tv" x="20" y="68">6 of 6</text>
    <text class="tl" x="20" y="90">no invented details</text>
  </g>
  <g transform="translate(910,296)">
    <rect class="tile" width="250" height="104" rx="12"/>
    <text class="tl" x="20" y="32">Automated tests</text>
    <text class="tv" x="20" y="68">716</text>
    <text class="tl" x="20" y="90">passing</text>
  </g>
</svg>
