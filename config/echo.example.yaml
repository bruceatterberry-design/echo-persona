# Echo Persona settings. Copy to config/echo.yaml (not shared in git) and change what you need; everything is optional.
# Restart Echo afterwards: launchctl kickstart -k gui/$(id -u)/com.echopersona.core (and .voice for dataset_root).

# Where recordings, photos and rendered face frames are kept. An external SSD is recommended (lots of data, easy to back up).
dataset_root: "/Volumes/External storage/EchoPersona-Data"

# The person Echo mostly talks with. Echo then uses their name only now and then, like people do. Blank = no filtering.
owner_name: ""        # your first name: say "This is <name>" so Echo learns your voice in the room
loved_one_name: ""

personality_file: "config/personality.yaml"   # copy config/personality.example.yaml there and fill it in

llm:
  model: "qwen3.5:9b-q4_K_M"   # the default since 1.0.0 (6.6 GB). Any Ollama model works; with 16 GB stay around
                               # 8-9B 4-bit so the voice and speech recognition fit. Old default: "llama3.1:8b"
  temperature: 0.4             # use 0.7 with llama3.1:8b
  think: false                 # Qwen's thinking mode waits 2-4 minutes before the first word: keep it off

# Daydream (developer option, off and hidden by default; see README 'What's new in 1.0.0')
daydream:                  # core/daydream.py: extra thinking power for one complex task, on request
  enabled: false           # off in every copy except the owner's development Mac
  owner_machine: ""        # this Mac's IOPlatformUUID; Daydream stays hidden on any other machine
  max_parts: 4             # Echo splits a task into at most this many parts
  task_timeout_s: 480      # a daydream that takes longer ends and says so (room for waking the tower)
  local_think: false       # let Echo's model "think" during a daydream (slower, sometimes better)
  tower:                   # the tower's model through the Dream Bridge (never a second connection)
    use: true
    timeout_s: 90
    max_tokens: 500
    wake: true               # tower off? send Wake-on-LAN through the bridge and wait for it
    wake_wait_s: 150         # how long to wait for the tower to boot and link          # per part; tower measured 4×800 ≈ 97 s > 90 s deadline (11-04)
  claude:                  # Claude through core/claude_helper.py; ALSO needs jobs.daydream in config/claude.json
    use: true
  consistency_runs: 3      # test-set runs only (scripts/daydream_set.py): repeats per task
  training:                # saved examples -> LoRA (not built yet)
    enabled: false
    min_examples: 50
    min_score: 0.8
    where: mac_overnight
    keep_versions: 2
